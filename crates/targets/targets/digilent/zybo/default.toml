# Digilent Zybo (Zynq-7000 XC7Z010), the first Zybo (board files rev B.3)
#
# The harness sits in the PL and is reached over the on-board USB JTAG, like
# on the PYNQ-Z1. No program runs on the PS's CPUs, so set the boot jumper
# (JP5) to JTAG.
#
# Values come from the Xilinx board store's Zybo B.3 files (board.xml,
# part0_pins.xml, preset.xml; see README.md) and the BSDL Vivado ships.
#
# **JTAG only.** The 512 MB DDR3 belongs to the PS. `dram` reaches it through
# the PS's S_AXI_HP0 port, and `hio program` sets the PS up over JTAG after
# the bitstream (`hio dap ps7-init`); see `[provides] dram`. The USB-UART is
# wired to the PS (MIO), so the PL has no UART.
#
# Checked on a board (2026-10-19): `hio probe` showed the two TAPs as
# described below, `hio program` set the PS up, and `examples/hw/dram`'s
# bring-up passed through the PS's DDR.

[board]
provider    = "digilent"
name        = "zybo"
description = "Digilent Zybo (Zynq-7000 XC7Z010)"
url         = "https://digilent.com/reference/programmable-logic/zybo/start"

[device]
vendor = "xilinx"
family = "zynq"
part   = "xc7z010clg400-1"

# Regex matched against the device names hw_manager lists. On a Zynq the chain
# also shows `arm_dap_0`, which this does not match.
hw_pattern = "xc7z010"

[vivado]
# The PS7 settings, beside this file (provenance in README.md). `gen` copies
# them, and the PS7 IP is built from them, with no board files.
ps7_preset = "ps7_preset.tcl"

[provides]
transport = ["jtag"]

# The PS's DDR3 (two MT41K128M16 JT-125, 32 bits), through S_AXI_HP0: 64-bit
# AXI3 with 6-bit IDs, at the PS address `base`. The harness shows the upper
# 256 MB (0x1000_0000 up), as on the PYNQ-Z1: the window must be a power of
# two, and this keeps clear of the low 1 MB, where the PS may map its on-chip
# memory.
dram = {kind = "ddr3", device = "MT41K128M16 JT-125", channels = 1, mb = 512, controller = "ps7", axi_data_bits = 64, axi_addr_bits = 28, axi_id_bits = 6, base = 0x1000_0000}

# 36Kb x 60 = 2,160 Kbit on the XC7Z010. From the datasheet.
bram_kb = 270

# The 125 MHz clock to the PL, from the Ethernet PHY (RTL8211E), as on the
# PYNQ-Z1. board.xml calls it a 50 MHz oscillator in its description, but
# gives 125 MHz as the frequency, and the reference manual agrees with 125.
# Setting the PS up rewrites the PHY's MIO pins, so the window may stop for a
# moment after ps7_init; `hio program` waits for it. On this board `id` passed
# at the first try.
[clocks.sys]
freq_mhz = 125
diff     = false
pin      = "L16"
standard = "LVCMOS33"

# BTN0. Pressed is high, as on Digilent's other boards (not measured).
[resets.sys]
pin      = "R18"
standard = "LVCMOS33"
active   = "high"

[jtag]
# The ceiling constrained on the bridge's TCK. **A choice, not a
# measurement**, the same as the other boards.
max_tck_mhz = 30

# The TCK `hio` runs. The PYNQ-Z1's value; the bring-up passed at it. Faster
# was not tried.
host_tck_mhz = 15

# The on-board FT2232H, channel A. Measured on a board: the same product
# string and level-shifter enable as the PYNQ-Z1.
vid         = 0x0403
pid         = 0x6010
interface   = 0
product     = "Digilent Adept USB Device"
layout_init = [0x0088, 0x008b]

# --- The chain ---
#
# A Zynq-7000 has two TAPs in series: TDI -> ARM DAP -> PL TAP -> TDO (the
# BSDL's design warning; UG585, "JTAG and DAP Subsystem"). `hio` talks to the
# PL TAP and holds the DAP in BYPASS. Its IR is 4 bits
# (<Vivado>/data/parts/xilinx/zynq/public/bsdl/zynq7000_arm_dap.bsd, IDCODE
# 0x4ba00477).
chain_tdo_side = []
chain_tdi_side = [4]

# The ARM DAP is that TAP. `hio dap` reaches the PS's memory through it, with
# no program on the CPUs. Access port 0 is the AHB MEM-AP (system memory), as
# read on a PYNQ-Z1.
dap = { side = "tdi", index = 0, mem_ap = 0 }

# The PL TAP's IDCODE. The BSDL leaves the top 4 bits (the silicon revision)
# open; the board read 0x13722093.
idcode = 0x13722093

# --- JTAG instructions of the PL TAP (from the BSDL) ---
#
#   <Vivado>/data/parts/xilinx/zynq/public/bsdl/xc7z010_clg400.bsd
#
# `INSTRUCTION_LENGTH` is 6, and the codes are those of the 7-series.
ir_length   = 6
user1_ir    = 0x02
jprogram_ir = 0x0b
cfg_in_ir   = 0x05
jstart_ir   = 0x0c
bypass_ir   = 0x3f

# --- Status checks ---
#
# The same as the PYNQ-Z1's.
[jtag.ready]
ir     = 0x14   # ISC_NOOP
expect = 0x11
mask   = 0x31

[jtag.done]
ir     = 0x09   # IDCODE
expect = 0x31
mask   = 0x11

[topology]
nodes = 1
links = []
