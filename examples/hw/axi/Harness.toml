[dut]
module = "dut_top"

[clock.i_clk]
freq_mhz = 100

[bundle.ctl]
backing  = "reg"
ports    = ["i_addr", "i_wdata", "i_start_wr", "i_start_rd", "i_sweep",
            "o_rdata", "o_busy", "o_reads", "o_writes", "o_resp"]

# The DUT's AXI4 master, on FPGA memory. The host reaches the same memory
# through an arbiter, as it would a real controller. `backing` says where the
# data lives, not what the port looks like: `examples/hw/dram` is this design
# with `backing = "dram"`.
[bundle.mem]
backing  = "bram"
depth    = 256
# 1KB of memory through a 256-byte window that moves. `mem_base_jtag` says
# which page is showing, and `hio` moves it.
aperture = 256
ports    = ["axi"]

# Heartbeat UART. Readable even when the transport is not working.
[heartbeat]
pin = "uart_tx"
