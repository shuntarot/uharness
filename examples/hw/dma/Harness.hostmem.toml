[dut]
module = "dut_top"

[clock.i_clk]
freq_mhz = 100

# Engine control and results: the host writes these and reads these.
[bundle.ctl]
backing  = "reg"
ports    = ["i_start", "i_addr", "i_dst", "i_size", "o_busy", "o_done", "o_sum", "o_beats",
            "o_errors"]

# The same DUT on host memory, over PCIe: only `backing` changes, and
# `host_mem` adds `aperture`, the bytes of host memory the DUT may reach. The
# host hands over one huge page (2 MB on most machines) while `hio` runs.
#
#   veryl harness gen --config Harness.hostmem.toml --target <board> --transport pcie -o hns/<board>_hostmem
[bundle.hmem]
backing  = "host_mem"
aperture = "2M"
ports   = { rd_cmd_valid = "o_cmd_valid", rd_cmd_ready  = "i_cmd_ready",
            rd_cmd_addr  = "o_cmd_addr",  rd_cmd_size = "o_cmd_size",
            rd_valid     = "i_rd_valid",  rd_ready      = "o_rd_ready",
            rd_data      = "i_rd_data",   rd_last       = "i_rd_last",
            rd_error     = "i_rd_error",
            wr_cmd_valid = "o_wcmd_valid", wr_cmd_ready = "i_wcmd_ready",
            wr_cmd_addr  = "o_wcmd_addr",  wr_cmd_size  = "o_wcmd_size",
            wr_valid     = "o_w_valid",    wr_ready     = "i_w_ready",
            wr_data      = "o_w_data",     wr_last      = "o_w_last",
            wr_done_valid = "i_w_done",    wr_done_error = "i_w_done_error" }
