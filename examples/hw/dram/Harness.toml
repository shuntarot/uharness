[dut]
module = "dut_top"

[clock.i_clk]
freq_mhz = 100

[bundle.ctl]
backing  = "reg"
ports    = ["i_addr", "i_wdata", "i_start_wr", "i_start_rd", "i_sweep",
            "o_rdata", "o_busy", "o_reads", "o_writes", "o_resp"]

# The DUT's AXI4 master, on the board's memory controller. The host reaches
# the same memory through an arbiter. The same manifest with
# `backing = "bram"` is `examples/hw/axi`.
[bundle.mem]
backing  = "dram"
# No `depth`: the whole memory the controller can address (256MB on the Arty,
# 2GB on the VCU118), so the register map depends on the board. `depth = "64M"`
# would keep one map for every board.
#
# The window is 32MB and moves: `mem_base_jtag` / `mem_base_pcie` say which
# page each master sees, and `hio` moves them. `hio memtest mem --size 1024`
# checks the path; the whole memory (`--size 256M` on the Arty) checks every
# address pin.
aperture = "32M"
ports    = ["axi"]

# The BAR has to hold the window plus the registers, so it is the next power of
# two above 32MB.
[pcie]
bar_bytes = "64M"

# Heartbeat UART. Readable even when the transport is not working.
[heartbeat]
pin = "uart_tx"
